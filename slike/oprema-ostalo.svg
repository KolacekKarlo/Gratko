<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Ostala građevinska oprema: betonska miješalica i kolica">
  <rect width="800" height="500" fill="#F6EFDD"/>
  <rect y="436" width="800" height="64" fill="#EADFC1"/>

  <!-- betonska mijesalica -->
  <g fill="#2B1409">
    <!-- noge i okvir -->
    <path d="M168 330 h26 l-26 112 h-30 z"/>
    <path d="M268 330 h26 l30 112 h-30 z"/>
    <rect x="150" y="416" width="170" height="18" rx="8"/>
    <!-- bubanj -->
    <circle cx="228" cy="276" r="92"/>
    <!-- grlo -->
    <path d="M286 212 l62 -46 34 46 -62 46 z"/>
  </g>
  <ellipse cx="350" cy="208" rx="26" ry="36" transform="rotate(-34 350 208)" fill="#F2B90F"/>
  <!-- kolo za naginjanje -->
  <circle cx="132" cy="286" r="34" fill="none" stroke="#5A3B26" stroke-width="12"/>
  <g stroke="#5A3B26" stroke-width="8" stroke-linecap="round">
    <path d="M196 352 h64"/>
  </g>
  <!-- kotaci -->
  <circle cx="176" cy="438" r="26" fill="#2B1409"/>
  <circle cx="176" cy="438" r="10" fill="#F6EFDD"/>
  <circle cx="296" cy="438" r="26" fill="#2B1409"/>
  <circle cx="296" cy="438" r="10" fill="#F6EFDD"/>

  <!-- gradjevinska kolica -->
  <g fill="#2B1409">
    <path d="M454 282 h234 l-42 110 H496 z"/>
    <path d="M668 318 l104 -40 10 26 -104 40 z"/>
    <rect x="762" y="258" width="34" height="46" rx="12"/>
    <rect x="506" y="390" width="20" height="54" rx="6"/>
    <path d="M598 380 h22 l10 34 h-24 z"/>
  </g>
  <g stroke="#F2B90F" stroke-width="10" stroke-linecap="round">
    <path d="M478 306 h186"/>
  </g>
  <circle cx="614" cy="414" r="40" fill="#2B1409"/>
  <circle cx="614" cy="414" r="16" fill="#F6EFDD"/>
  <circle cx="614" cy="414" r="6" fill="#2B1409"/>
</svg>
